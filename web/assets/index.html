<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fußbodenheizung - Regelung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .status-banner {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status-icon {
            font-size: 2em;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f0f0f0;
        }
        
        .status-icon.valid {
            background: #d4edda;
            color: #28a745;
        }
        
        .status-icon.invalid {
            background: #f8d7da;
            color: #dc3545;
        }
        
        .status-info h3 {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .status-info p {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .circuits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .circuit-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .circuit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        
        .circuit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        
        .circuit-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        
        .valve-indicator {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 0.8em;
            transition: all 0.3s;
        }
        
        .valve-indicator.open {
            background: #28a745;
        }
        
        .valve-indicator.closed {
            background: #6c757d;
        }
        
        .temperature-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .temp-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .temp-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .temp-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }
        
        .temp-unit {
            font-size: 0.7em;
            color: #999;
        }
        
        .sensor-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            color: #666;
            margin-top: 8px;
        }
        
        .sensor-status.invalid {
            color: #dc3545;
            font-weight: bold;
        }
        
        .control-section {
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
            margin-top: 20px;
        }
        
        .setpoint-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .setpoint-label {
            font-size: 0.95em;
            font-weight: 600;
            color: #333;
            min-width: 80px;
        }
        
        .setpoint-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .setpoint-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .setpoint-button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .setpoint-button:hover {
            background: #764ba2;
        }
        
        .setpoint-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .heating-curve-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .heating-curve-section h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #333;
        }
        
        .heating-curve-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .data-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .data-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .data-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .system-status-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .system-status-section h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #333;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .status-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .status-card.error {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        
        .status-card h4 {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .status-card p {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }
        
        .update-timestamp {
            text-align: center;
            color: #999;
            font-size: 0.85em;
            margin-top: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .circuits-grid {
                grid-template-columns: 1fr;
            }
            
            .temperature-display {
                grid-template-columns: 1fr;
            }
            
            .setpoint-control {
                flex-direction: column;
            }
            
            .setpoint-input,
            .setpoint-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Fußbodenheizung</h1>
            <p>Intelligente Regelung mit Vorlauftemperatur-Optimierung</p>
        </header>
        
        <div id="errorContainer" class="error-message"></div>
        
        <!-- System Status Banner -->
        <div class="status-banner" id="statusBanner">
            <div class="status-item">
                <div class="status-icon" id="flowSensorIcon">⏳</div>
                <div class="status-info">
                    <h3>Vorlauftemperatur</h3>
                    <p id="flowTemp">-- °C</p>
                </div>
            </div>
            <div class="status-item">
                <div class="status-icon" id="outdoorSensorIcon">⏳</div>
                <div class="status-info">
                    <h3>Außentemperatur</h3>
                    <p id="outdoorTemp">-- °C</p>
                </div>
            </div>
            <div class="status-item">
                <div class="status-icon" id="targetFlowIcon">🎯</div>

                    <h3>Ziel-Vorlauf</h3>
                    <p id="targetFlowTemp">-- °C</p>
                </div>
            </div>
            <div class="status-item">
                <div class="status-icon">🕐</div>
                <div class="status-info">
                    <h3>Status</h3>
                    <p id="updateStatus">Wird aktualisiert...</p>
                </div>
            </div>
        </div>
        
        <!-- Heizkreise (Circuits) -->
        <div class="circuits-grid" id="circuitsContainer">
            <!-- Dynamically populated by JavaScript -->
        </div>
        
        <!-- Heating Curve Section -->
        <div class="heating-curve-section">
            <h2>📈 Heizgradkurve</h2>
            <div class="heating-curve-data" id="heatingCurveData">
                <!-- Dynamically populated by JavaScript -->
            </div>
        </div>
        
        <!-- System Status -->
        <div class="system-status-section">
            <h2>⚙️ Systemstatus</h2>
            <div class="status-grid" id="systemStatusGrid">
                <!-- Dynamically populated by JavaScript -->
            </div>
        </div>
        
        <div class="update-timestamp" id="lastUpdate">
            Zuletzt aktualisiert: --
        </div>
    </div>
    
    <script>
        // Configuration and Constants
        const API_BASE = '/api';
        const UPDATE_INTERVAL = 5000;  // 5 seconds
        const TEMP_PRECISION = 1;
        
        let config = {};
        let lastUpdateTime = 0;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConfiguration();
            updateData();
            setInterval(updateData, UPDATE_INTERVAL);
        });
        
        // Load configuration from API
        async function loadConfiguration() {
            try {
                const response = await fetch(`${API_BASE}/config`);
                config = await response.json();
                renderCircuits();
                renderHeatingCurveConfig();
            } catch (error) {
                showError('Fehler beim Laden der Konfiguration: ' + error.message);
            }
        }
        
        // Fetch and update all sensor data
        async function updateData() {
            try {
                const [sensorsRes, statusRes] = await Promise.all([
                    fetch(`${API_BASE}/sensors`),
                    fetch(`${API_BASE}/status`)
                ]);
                
                const sensorsData = await sensorsRes.json();
                const statusData = await statusRes.json();
                
                updateStatusBanner(statusData);
                updateCircuitCards(statusData);
                updateSystemStatus(statusData);
                updateLastUpdate(statusData.timestamp);
                lastUpdateTime = Date.now();
            } catch (error) {
                showError('Fehler beim Aktualisieren der Daten: ' + error.message);
            }
        }

            flowTempElem.innerHTML = data.flow_temperature.toFixed(TEMP_PRECISION) + ' <span style="font-size: 0.7em;">°C</span>';
